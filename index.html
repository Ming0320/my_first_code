<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>待办清单</title>
<style>
  :root {
    --bg:#f5f7fa; --card:#fff; --text:#222; --sub:#888;
    --pri:#3b82f6; --border:#e5e7eb; --red:#ef4444; --green:#22c55e; --yellow:#eab308; --gray:#d1d5db;
    --radius:14px; --shadow:0 4px 12px rgba(0,0,0,.04);
  }
  .dark { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --sub:#94a3b8; --border:#334155; --shadow:0 4px 12px rgba(0,0,0,.2); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:16px;font-family:-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:16px}

  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .header h1{margin:0;font-size:24px;font-weight:700}
  .header-right{display:flex;gap:8px;align-items:center}
  #themeBtn{width:36px;height:36px;border-radius:50%;border:none;background:var(--card);font-size:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
  #toggleComposer{width:40px;height:40px;border-radius:50%;border:none;background:var(--pri);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(59,130,246,.35);display:flex;align-items:center;justify-content:center;transition:transform .2s;flex-shrink:0}
  #toggleComposer.open{transform:rotate(45deg)}

  .composer{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:max-height .3s ease,opacity .2s;max-height:0;opacity:0;margin-bottom:0}
  .composer.show{max-height:200px;opacity:1;margin-bottom:14px}
  .composer-inner{padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .composer input{flex:1 1 140px;min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;outline:none}
  .composer input:focus{border-color:var(--pri)}
  .composer button{padding:10px 18px;border:none;border-radius:10px;background:var(--pri);color:#fff;font-size:15px;font-weight:600;cursor:pointer;flex-shrink:0}

  .toolbar{margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
  .filters,.cat-filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filters::-webkit-scrollbar,.cat-filters::-webkit-scrollbar{display:none}
  .chip{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:14px;white-space:nowrap;cursor:pointer;color:var(--text);flex-shrink:0;transition:all .15s}
  .chip.active{background:var(--pri);border-color:var(--pri);color:#fff}
  .toolbar-actions{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
  .toolbar-actions button{border:none;background:none;color:var(--sub);font-size:13px;cursor:pointer;padding:4px 8px}
  .toolbar-actions button:hover{color:var(--pri)}

  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  li{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:flex;align-items:flex-start;gap:10px}
  li.editing{background:#f8fafc}
  .cb{width:20px;height:20px;flex-shrink:0;margin-top:2px;accent-color:var(--pri);cursor:pointer}
  .dot{font-size:18px;cursor:pointer;user-select:none;min-width:24px;text-align:center;line-height:1.4;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;word-break:break-word}
  .txt{font-size:16px;line-height:1.5;white-space:pre-wrap}
  .txt.done{text-decoration:line-through;color:var(--sub)}
  .txt.overdue{color:var(--red)}
  .edit{display:none;width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:var(--bg);color:var(--text)}
  li.editing .txt{display:none}
  li.editing .edit{display:block}
  .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--sub);margin-top:2px}
  .cat-tag{background:rgba(59,130,246,.1);color:var(--pri);padding:2px 8px;border-radius:999px;font-weight:500}
  .due.over{color:var(--red);font-weight:600}
  .actions{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
  .actions button{border:none;background:var(--bg);color:var(--sub);padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
  .actions button:hover{color:var(--pri);background:rgba(59,130,246,.08)}
  .actions .del:hover{color:#fff;background:var(--red)}

  @media(max-width:480px){
    li{flex-wrap:wrap}
    .actions{flex-direction:column;gap:4px;padding-left:8px;border-left:1px solid var(--border)}
  }
</style>
</head>
<body>
<div class="header">
  <h1>待办清单</h1>
  <div class="header-right">
    <button id="toggleComposer">+</button>
    <button id="themeBtn">🌙</button>
  </div>
</div>

<div class="composer" id="composer">
  <div class="composer-inner">
    <input id="input" placeholder="添加新任务...">
    <input id="catInput" placeholder="分类(可选)">
    <input id="dateInput" type="date">
    <button id="addBtn">添加</button>
  </div>
</div>

<div class="toolbar">
  <div class="filters" id="filters">
    <span class="chip active" data-f="all">全部</span>
    <span class="chip" data-f="undone">未完成</span>
    <span class="chip" data-f="done">已完成</span>
  </div>
  <div class="cat-filters" id="catFilters"></div>
  <div class="toolbar-actions">
    <span id="stats"></span>
    <button id="clearDone">清空已完成</button>
  </div>
</div>

<ul id="list"></ul>

<script>
let tasks=JSON.parse(localStorage.getItem('todos')||'[]');
let filter='all', catFilter='all';

const input=document.getElementById('input'), catInput=document.getElementById('catInput'), dateInput=document.getElementById('dateInput'), addBtn=document.getElementById('addBtn'), list=document.getElementById('list'), cf=document.getElementById('catFilters'), stats=document.getElementById('stats'), composer=document.getElementById('composer'), toggleBtn=document.getElementById('toggleComposer');

function save(){localStorage.setItem('todos',JSON.stringify(tasks));render()}
function fmtDate(d){return d?new Date(d).toLocaleDateString('zh-CN',{year:'numeric',month:'numeric',day:'numeric'}):''}
function isOverdue(d){return d&&new Date(d)<new Date(new Date().toDateString())}
function getDot(p){return p==='high'?'🔴':p==='mid'?'🟡':p==='low'?'🟢':'⚪'}
function nextPriority(p){return p==='none'?'low':p==='low'?'mid':p==='mid'?'high':'none'}

toggleBtn.onclick=()=>{
  composer.classList.toggle('show');
  toggleBtn.classList.toggle('open');
  if(composer.classList.contains('show')) input.focus();
};

function render(){
  list.innerHTML='';
  let arr=tasks.slice();
  const w={high:4,mid:3,low:2,none:1};
  arr.sort((a,b)=>{
    if(isOverdue(a.due)!==isOverdue(b.due))return isOverdue(b.due)-isOverdue(a.due);
    return w[b.priority]-w[a.priority];
  });
  if(filter==='undone')arr=arr.filter(t=>!t.done);
  if(filter==='done')arr=arr.filter(t=>t.done);
  if(catFilter!=='all')arr=arr.filter(t=>t.cat===catFilter);

  cf.innerHTML='';
  const cats=[...new Set(tasks.map(t=>t.cat).filter(Boolean))];
  if(cats.length){
    const allC=document.createElement('span');allC.className='chip'+(catFilter==='all'?' active':'');allC.textContent='全部分类';allC.onclick=()=>{catFilter='all';render()};cf.appendChild(allC);
    cats.forEach(c=>{const s=document.createElement('span');s.className='chip'+(catFilter===c?' active':'');s.textContent='#'+c;s.onclick=()=>{catFilter=c;render()};cf.appendChild(s)});
  }

  arr.forEach(t=>{
    const li=document.createElement('li');if(t.editing)li.classList.add('editing');
    const cb=document.createElement('input');cb.type='checkbox';cb.className='cb';cb.checked=t.done;cb.onchange=()=>{t.done=cb.checked;save()};
    const dot=document.createElement('span');dot.className='dot';dot.textContent=getDot(t.priority);dot.onclick=()=>{t.priority=nextPriority(t.priority);save()};
    const body=document.createElement('div');body.className='body';
    const txt=document.createElement('span');txt.className='txt';txt.textContent=t.text;if(t.done)txt.classList.add('done');if(!t.done&&isOverdue(t.due))txt.classList.add('overdue');
    const editInput=document.createElement('input');editInput.className='edit';editInput.value=t.text;
    const meta=document.createElement('div');meta.className='meta';
    if(t.cat){const ct=document.createElement('span');ct.className='cat-tag';ct.textContent='#'+t.cat;meta.appendChild(ct)}
    if(t.due){const dd=document.createElement('span');dd.className='due'+(isOverdue(t.due)&&!t.done?' over':'');dd.textContent='📅 '+fmtDate(t.due)+(isOverdue(t.due)&&!t.done?' 已超期':'');meta.appendChild(dd)}
    body.append(txt,editInput,meta);
    const actions=document.createElement('div');actions.className='actions';
    const editBtn=document.createElement('button');editBtn.textContent=t.editing?'保存':'编辑';editBtn.onclick=()=>{if(t.editing){const v=editInput.value.trim();if(v)t.text=v}t.editing=!t.editing;save()};
    const delBtn=document.createElement('button');delBtn.className='del';delBtn.textContent='删除';delBtn.onclick=()=>{tasks=tasks.filter(x=>x!==t);save()};
    actions.append(editBtn,delBtn);
    li.append(cb,dot,body,actions);list.appendChild(li);
  });

  [...document.querySelectorAll('#filters [data-f]')].forEach(s=>{s.classList.toggle('active',s.dataset.f===filter);s.onclick=()=>{filter=s.dataset.f;render()}});
  const doneC=tasks.filter(t=>t.done).length,overC=tasks.filter(t=>!t.done&&isOverdue(t.due)).length;
  stats.textContent=`共 ${tasks.length} 项 · 已完成 ${doneC} 项`+(overC?` · 超期 ${overC} 项`:'');
}

addBtn.onclick=()=>{const v=input.value.trim();if(!v)return;tasks.push({text:v,done:false,priority:'none',editing:false,cat:catInput.value.trim(),due:dateInput.value,order:tasks.length});input.value='';catInput.value='';dateInput.value='';save()};
input.addEventListener('keydown',e=>{if(e.key==='Enter')addBtn.click()});
clearDone.onclick=()=>{tasks=tasks.filter(t=>!t.done);save()};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark'))};
if(localStorage.getItem('dark')==='true')document.body.classList.add('dark');

render();
</script>
</body>
</html>
